server:
  # 8080 被本机其他容器(compose-web)占用，改用8081
  port: 8081

spring:
  application:
    name: lhjypt-core

  datasource:
    # PostgreSQL - 交易/持仓/资金数据
    primary:
      jdbc-url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/lhjypt}
      username: ${POSTGRES_USER:lhjypt}
      password: ${POSTGRES_PASSWORD:lhjypt_local_dev}
      driver-class-name: org.postgresql.Driver
      # 连接池（P3-007 显式化，按压测基线留余量）
      pool-name: ${POSTGRES_POOL_NAME:lhjypt-pg}
      maximum-pool-size: ${POSTGRES_POOL_MAX:20}
      minimum-idle: ${POSTGRES_POOL_MIN:5}
      connection-timeout: ${POSTGRES_POOL_TIMEOUT_MS:30000}
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 5000
    # ClickHouse - 行情时序数据
    clickhouse:
      jdbc-url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/lhjypt}
      username: ${CLICKHOUSE_USER:default}
      password: ${CLICKHOUSE_PASSWORD:}
      driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      pool-name: ${CLICKHOUSE_POOL_NAME:lhjypt-ch}
      maximum-pool-size: ${CLICKHOUSE_POOL_MAX:10}
      minimum-idle: ${CLICKHOUSE_POOL_MIN:2}
      connection-timeout: ${CLICKHOUSE_POOL_TIMEOUT_MS:30000}

  # Redis：分布式锁/限流/降级开关
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: lhjypt-core
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 交易平台配置
lhjypt:
  # 交易运行模式：MOCK / LIVE。LIVE 在真实适配器就绪前必须启动失败。
  trade:
    mode: ${LHJYPT_TRADE_MODE:MOCK}
  # 真实行情源（OBS-005 Gate.io 现货 K 线，公开免密钥；手动 refresh 才外呼）
  market:
    real:
      enabled: ${LHJYPT_MARKET_REAL:true}
      base-url: ${LHJYPT_MARKET_REAL_URL:https://api.gateio.ws/api/v4/spot/candlesticks}
      currency-pair: ${LHJYPT_MARKET_REAL_PAIR:BTC_USDT}
      interval: ${LHJYPT_MARKET_REAL_INTERVAL:1h}
      limit: ${LHJYPT_MARKET_REAL_LIMIT:200}
      timeout-seconds: ${LHJYPT_MARKET_REAL_TIMEOUT:25}
      # 行情源优先级（按序故障切换；gateio 主源较慢，binance-vision 备用快速）
      sources: ${LHJYPT_MARKET_REAL_SOURCES:gateio,binance-vision}
      max-attempts: ${LHJYPT_MARKET_REAL_ATTEMPTS:2}
      retry-backoff-ms: ${LHJYPT_MARKET_REAL_BACKOFF:800}
      refresh-interval-ms: ${LHJYPT_MARKET_REAL_REFRESH_MS:900000}  # 定时自动刷新间隔（>=5000；关闭请设 LHJYPT_MARKET_REAL=false）
      # 分页回补（P4-001）：总历史 = backfill-page-size × backfill-max-pages
      backfill-page-size: ${LHJYPT_MARKET_REAL_BACKFILL_PAGE:1000}
      backfill-max-pages: ${LHJYPT_MARKET_REAL_BACKFILL_PAGES:10}
  # CTP柜台配置
  ctp:
    enabled: false
    broker-id: ""
    user-id: ""
    password: ""
    md-front: ""
    td-front: ""
  # 风控配置
  risk:
    max-position-per-symbol: 0.1
    max-total-position: 0.8
    max-daily-loss: 0.05
    stop-loss-line: 0.03
    intraday:
      eval-interval: 5000        # 事中风控评估间隔(ms)
    budget:
      refresh-interval-ms: ${LHJYPT_RISK_BUDGET_REFRESH:30000}  # 风险预算占用刷新间隔(ms)
  # 资金配置
  fund:
    overdraft-allowed: false
    margin-ratio: 0.1
  # 跨境交收
  settlement:
    daily-cron: ${LHJYPT_SETTLEMENT_DAILY_CRON:0 5 0 * * *}  # 每日生成成交交收任务并处理到期
  # 容量管理与自动伸缩（P2 模块五）
  capacity:
    warn-pct: ${LHJYPT_CAPACITY_WARN:0.8}
    scale-pct: ${LHJYPT_CAPACITY_SCALE:0.9}
    autoscale-enabled: ${LHJYPT_CAPACITY_AUTOSCALE:true}
    autoscale-provider: ${LHJYPT_CAPACITY_PROVIDER:noop}   # noop | k8s（生产预留）
    desired-min: ${LHJYPT_CAPACITY_MIN_REPLICAS:1}
    desired-max: ${LHJYPT_CAPACITY_MAX_REPLICAS:10}
    sample-interval-ms: ${LHJYPT_CAPACITY_INTERVAL_MS:30000}
  # 分布式调度锁（多实例下定时任务仅一个实例执行；PRD §10.1）
  schedule:
    lock:
      enabled: ${LHJYPT_SCHEDULE_LOCK_ENABLED:true}
      ttl-seconds: 120
  # P1 监控告警配置
  monitoring:
    enabled: true
    sample-interval: 10000      # 指标采样间隔(ms)
    evaluate-interval: 15000    # 告警评估间隔(ms)
    # 告警通知渠道（生产可接钉钉/企业微信/通用 webhook；本地默认关闭仅落库）
    notify:
      enabled: ${LHJYPT_NOTIFY_ENABLED:false}
      type: ${LHJYPT_NOTIFY_TYPE:generic}          # dingtalk | wecom | generic
      webhook-url: ${LHJYPT_NOTIFY_WEBHOOK:}
      timeout-ms: 3000
  # P1 策略加密与沙箱配置
  strategy:
    # 自动值守（OBS-010）：扫描间隔；值守列表由 API 动态管理
    watchdog:
      enabled: ${LHJYPT_STRATEGY_WATCHDOG:true}
      scan-interval-ms: ${LHJYPT_STRATEGY_WATCHDOG_SCAN:30000}
    crypto:
      provider: ${LHJYPT_CRYPTO_PROVIDER:local}    # local | env（生产可扩展 kms/hsm，SPI 预留）
      key-store-path: ${LHJYPT_KEYSTORE_PATH:config/key-store.properties}
      active-key-id: ${LHJYPT_ACTIVE_KEY_ID:local-dev-1}
      allow-dev-fallback: ${LHJYPT_ALLOW_DEV_KEY:true}
      env-key-prefix: ${LHJYPT_CRYPTO_ENV_PREFIX:LHJYPT_STRATEGY_KEY_}
      # kms provider：GET {kms-url}/keys/{keyId}
      kms-url: ${LHJYPT_KMS_URL:}
      kms-token: ${LHJYPT_KMS_TOKEN:}
      kms-timeout-ms: ${LHJYPT_KMS_TIMEOUT_MS:3000}
    security:
      # 运行前校验环境绑定指纹（防止策略拷贝到其他机器运行）
      env-binding-enabled: ${LHJYPT_STRATEGY_ENV_BINDING:true}
    sandbox:
      executor: ${LHJYPT_SANDBOX_EXECUTOR:process} # process | docker（生产容器沙箱）
      python: ${LHJYPT_SANDBOX_PYTHON:python3}
      sdk-path: ${LHJYPT_SDK_PATH:strategy-sdk}
      timeout-seconds: 30
      max-memory-mb: 256
      max-cpu-seconds: 30
      output-tail-bytes: 4096
      docker-image: ${LHJYPT_SANDBOX_IMAGE:python:3.11-alpine}
      docker-bin: ${LHJYPT_DOCKER_BIN:docker}
      docker-cpus: 1.0
      docker-pids-limit: 128
      docker-network: none
      # 镜像拉取策略：NEVER | IF_NOT_PRESENT | ALWAYS
      docker-pull-policy: ${LHJYPT_SANDBOX_PULL_POLICY:IF_NOT_PRESENT}
      docker-pull-timeout-seconds: ${LHJYPT_SANDBOX_PULL_TIMEOUT:300}
      # Docker Desktop(macOS) 需指向共享目录；Linux 留空用系统临时目录
      docker-work-dir: ${LHJYPT_SANDBOX_DOCKER_WORK_DIR:}

logging:
  level:
    com.lhjypt: DEBUG
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# ==================== P1 监控告警配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: lhjypt-core
