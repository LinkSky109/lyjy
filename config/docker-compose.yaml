services:
  # PostgreSQL - 交易/持仓/资金数据
  postgres:
    image: postgres:15-alpine
    container_name: lhjypt-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lhjypt}
      POSTGRES_USER: ${POSTGRES_USER:-lhjypt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lhjypt_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ../scripts/init-data-governance.sql:/docker-entrypoint-initdb.d/02-init-data-governance.sql:ro
      - ../scripts/init-p1.sql:/docker-entrypoint-initdb.d/03-init-p1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lhjypt} -d ${POSTGRES_DB:-lhjypt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse - 行情时序数据
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: lhjypt-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ../scripts/init-clickhouse.sql:/docker-entrypoint-initdb.d/01-init-clickhouse.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Kafka - 消息队列
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: lhjypt-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: lhjypt-kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Redis - 缓存
  redis:
    image: redis:7-alpine
    container_name: lhjypt-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  chdata:
  redisdata:
