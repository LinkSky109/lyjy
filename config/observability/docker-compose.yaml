# lhjypt 本机观测栈（P4-003）：Prometheus 抓取后端 /actuator/prometheus，Grafana 预置数据源与看板
#
#   用法：./scripts/obs.sh up      # 生成 .generated/prometheus.yml 并启动（宿主机 9090/3000）
#         ./scripts/obs.sh down
#         ./scripts/obs.sh status
#
# 抓取目标默认 host.lima.internal:8081（Lima）；Docker Desktop 用 LHJYPT_SCRAPE_TARGET=host.docker.internal:8081
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: lhjypt-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.generated/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus.rules.yml:/etc/prometheus/rules/lhjypt.rules.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.2.0
    container_name: lhjypt-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-lhjypt}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lhjypt-overview.json
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # 告警外发（P4-006）：Prometheus → Alertmanager → webhook（默认落到本地 sink）
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: lhjypt-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./.generated/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - amdata:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  # 本地 webhook 接收器（验证用；生产可用转发网关替换 LHJYPT_ALERT_WEBHOOK）
  alert-sink:
    image: python:3.12-alpine
    container_name: lhjypt-alert-sink
    restart: unless-stopped
    volumes:
      - ./alert-sink.py:/sink/sink.py:ro
    command: ["python", "/sink/sink.py"]

volumes:
  promdata:
  grafanadata:
  amdata:
